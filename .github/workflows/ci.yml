name: CI

on:
  push:
    branches: ["main", "master"]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  commit-style:
    name: Commit style
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Check commit messages follow the Forge convention
        env:
          BASE_REF: ${{ github.base_ref }}
        run: python3 scripts/check_commit_messages.py --range "origin/${BASE_REF}..HEAD"

  test:
    name: Test (${{ matrix.os }}, Python ${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        python-version: ["3.10", "3.12", "3.13"]
        include:
          # One spawn-start-method OS each; every matrix OS installs ffmpeg so
          # real video journeys run across Linux, macOS, and Windows.
          - os: macos-latest
            python-version: "3.13"
          - os: windows-latest
            python-version: "3.13"
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup uv and Python
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          python-version: ${{ matrix.python-version }}
          enable-cache: true

      - name: Install package
        run: uv sync --frozen --extra dev

      - name: Install ffmpeg for Linux video runtime tests
        if: runner.os == 'Linux'
        run: sudo apt-get update -qq && sudo apt-get install -y -qq --no-install-recommends ffmpeg

      - name: Install ffmpeg for macOS video runtime tests
        if: runner.os == 'macOS'
        run: brew install ffmpeg

      - name: Install ffmpeg for Windows video runtime tests
        if: runner.os == 'Windows'
        run: choco install ffmpeg --no-progress --yes

      - name: Static quality
        run: |
          uv run ruff check .
          uv run ruff format --check .
          uv run mypy . --ignore-missing-imports

      - name: Run tests
        run: uv run pytest -q --cov=pixshift --cov-report=term-missing --cov-fail-under=78
