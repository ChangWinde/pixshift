name: CI

on:
  push:
    branches: ["main", "master"]
  pull_request:

permissions:
  contents: read

jobs:
  commit-style:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Check commit messages follow the Forge convention
        run: python3 scripts/check_commit_messages.py --range "origin/${{ github.base_ref }}..HEAD"

  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12", "3.13"]
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup uv and Python
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          python-version: ${{ matrix.python-version }}
          enable-cache: true

      - name: Install package
        run: uv sync --frozen --extra dev

      - name: Install ffmpeg for the video runtime tests
        run: sudo apt-get update -qq && sudo apt-get install -y -qq --no-install-recommends ffmpeg

      - name: Static quality
        run: |
          uv run ruff check .
          uv run ruff format --check .
          uv run mypy . --ignore-missing-imports

      - name: Run tests
        run: uv run pytest -q --cov=pixshift --cov-report=term-missing --cov-fail-under=78
