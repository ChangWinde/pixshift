name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup uv and Python
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          python-version: "3.12"
          enable-cache: false

      - name: Install build dependencies
        run: uv sync --frozen --extra dev

      - name: Verify tag matches the package version
        shell: bash
        run: |
          package_version="$(uv run python -c 'import tomllib; print(tomllib.load(open("pyproject.toml", "rb"))["project"]["version"])')"
          test "${GITHUB_REF_NAME#v}" = "$package_version"

      - name: Static quality
        run: |
          uv run ruff check .
          uv run ruff format --check .
          uv run mypy . --ignore-missing-imports

      - name: Run tests with coverage gate
        run: uv run pytest -q --cov=pixshift --cov-report=term-missing --cov-fail-under=78

  build-sdist:
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup uv and Python
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          python-version: "3.12"
          enable-cache: false

      - name: Install build dependencies
        run: uv sync --frozen --extra dev

      - name: Build source distribution
        run: uv build --sdist

      - name: Check source distribution metadata
        run: uv run twine check dist/*

      - name: Upload source distribution
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: pixshift-sdist
          path: dist/*

  build-runtime-wheels:
    needs: verify
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux-x86_64
            os: ubuntu-latest
          - platform: linux-aarch64
            os: ubuntu-24.04-arm
          - platform: macos-x86_64
            os: macos-15-intel
          - platform: macos-arm64
            os: macos-latest
          - platform: windows-x86_64
            os: windows-latest
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup uv and Python
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          python-version: "3.12"
          enable-cache: false

      - name: Install build dependencies
        run: uv sync --frozen --extra dev

      - name: Stage authenticated FFmpeg runtime
        shell: bash
        run: uv run python scripts/stage_media_runtime.py --platform "${{ matrix.platform }}"

      - name: Execute runtime capability smoke test
        run: uv run python scripts/verify_media_runtime.py

      - name: Build and tag platform wheel
        shell: bash
        run: |
          uv build --wheel
          wheel_path="$(find dist -maxdepth 1 -name 'pixshift-*.whl' -print -quit)"
          platform_tag="$(uv run python -c 'from pathlib import Path; from scripts.stage_media_runtime import load_manifest; print(load_manifest(Path("scripts/media_runtime_manifest.json")).targets["${{ matrix.platform }}"].wheel_tag)')"
          uv run wheel tags --remove --platform-tag "$platform_tag" "$wheel_path"

      - name: Check wheel metadata
        run: uv run twine check dist/*

      - name: Verify installed wheel uses its packaged runtime (POSIX)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          smoke_dir="$RUNNER_TEMP/pixshift-wheel-smoke"
          uv venv "$smoke_dir"
          uv pip install --python "$smoke_dir/bin/python" dist/*.whl
          cd "$RUNNER_TEMP"
          "$smoke_dir/bin/python" -c 'from pixshift.core.media_runtime import BundledFFmpegProvider; runtime = BundledFFmpegProvider().resolve(); assert runtime is not None and runtime.source == "bundled"'

      - name: Verify installed wheel uses its packaged runtime (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $smokeDir = Join-Path $env:RUNNER_TEMP "pixshift-wheel-smoke"
          uv venv $smokeDir
          $python = Join-Path $smokeDir "Scripts/python.exe"
          $wheel = (Get-ChildItem "dist/*.whl").FullName
          uv pip install --python $python $wheel
          Push-Location $env:RUNNER_TEMP
          try {
            & $python -c 'from pixshift.core.media_runtime import BundledFFmpegProvider; runtime = BundledFFmpegProvider().resolve(); assert runtime is not None and runtime.source == "bundled"'
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          } finally {
            Pop-Location
          }

      - name: Upload platform wheel
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: pixshift-wheel-${{ matrix.platform }}
          path: dist/*

  publish:
    # Publishes via PyPI trusted publishing (OIDC); requires the `pypi`
    # environment and a matching publisher configured on pypi.org.
    # See docs/project/releasing.md for the one-time setup.
    needs: [build-sdist, build-runtime-wheels]
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/pixshift/
    permissions:
      id-token: write
    steps:
      - name: Download all build artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: pixshift-*
          path: dist
          merge-multiple: true

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
