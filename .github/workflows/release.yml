name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    name: Verify release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Setup uv and Python
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          python-version: "3.12"
          enable-cache: false

      - name: Install build dependencies
        run: uv sync --frozen --extra dev

      - name: Verify tag matches the package version
        shell: bash
        run: |
          package_version="$(uv run python -c 'import tomllib; print(tomllib.load(open("pyproject.toml", "rb"))["project"]["version"])')"
          test "${GITHUB_REF_NAME#v}" = "$package_version"
          test "$(git cat-file -t "refs/tags/${GITHUB_REF_NAME}")" = "tag"

      - name: Static quality
        run: |
          uv run ruff check .
          uv run ruff format --check .
          uv run mypy . --ignore-missing-imports

      - name: Run tests with coverage gate
        run: uv run pytest -q --cov=pixshift --cov-report=term-missing --cov-fail-under=78

  build-sdist:
    name: Build source distribution
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup uv and Python
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          python-version: "3.12"
          enable-cache: false

      - name: Install build dependencies
        run: uv sync --frozen --extra dev

      - name: Build source distribution
        run: uv build --sdist

      - name: Check source distribution metadata
        run: uv run twine check dist/*

      - name: Upload source distribution
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: pixshift-sdist
          path: dist/*

  build-runtime-wheels:
    name: Build runtime wheel (${{ matrix.platform }})
    needs: verify
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux-x86_64
            os: ubuntu-latest
          - platform: linux-aarch64
            os: ubuntu-24.04-arm
          - platform: macos-x86_64
            os: macos-15-intel
          - platform: macos-arm64
            os: macos-latest
          - platform: windows-x86_64
            os: windows-latest
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup uv and Python
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          python-version: "3.12"
          enable-cache: false

      - name: Install build dependencies
        run: uv sync --frozen --extra dev

      - name: Stage authenticated FFmpeg runtime
        shell: bash
        env:
          RUNTIME_PLATFORM: ${{ matrix.platform }}
        run: uv run python scripts/stage_media_runtime.py --platform "$RUNTIME_PLATFORM"

      - name: Execute runtime capability smoke test
        run: uv run python scripts/verify_media_runtime.py

      - name: Build and tag platform wheel
        shell: bash
        env:
          RUNTIME_PLATFORM: ${{ matrix.platform }}
        run: |
          uv build --wheel
          wheel_path="$(find dist -maxdepth 1 -name 'pixshift-*.whl' -print -quit)"
          platform_tag="$(uv run python -c 'import os; from pathlib import Path; from scripts.stage_media_runtime import load_manifest; print(load_manifest(Path("scripts/media_runtime_manifest.json")).targets[os.environ["RUNTIME_PLATFORM"]].wheel_tag)')"
          uv run wheel tags --remove --platform-tag "$platform_tag" "$wheel_path"

      - name: Check wheel metadata
        run: uv run twine check dist/*

      - name: Verify installed wheel uses its packaged runtime (POSIX)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          smoke_dir="$RUNNER_TEMP/pixshift-wheel-smoke"
          uv venv "$smoke_dir"
          uv pip install --python "$smoke_dir/bin/python" dist/*.whl
          cd "$RUNNER_TEMP"
          "$smoke_dir/bin/python" -c 'from pixshift.core.media_runtime import BundledFFmpegProvider; runtime = BundledFFmpegProvider().resolve(); assert runtime is not None and runtime.source == "bundled"'

      - name: Verify installed wheel uses its packaged runtime (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $smokeDir = Join-Path $env:RUNNER_TEMP "pixshift-wheel-smoke"
          uv venv $smokeDir
          $python = Join-Path $smokeDir "Scripts/python.exe"
          $wheel = (Get-ChildItem "dist/*.whl").FullName
          uv pip install --python $python $wheel
          Push-Location $env:RUNNER_TEMP
          try {
            & $python -c 'from pixshift.core.media_runtime import BundledFFmpegProvider; runtime = BundledFFmpegProvider().resolve(); assert runtime is not None and runtime.source == "bundled"'
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          } finally {
            Pop-Location
          }

      - name: Upload platform wheel
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: pixshift-wheel-${{ matrix.platform }}
          path: dist/*

  publish:
    name: Attest and publish to PyPI
    # Publishes via PyPI trusted publishing (OIDC); requires the `pypi`
    # environment and a matching publisher configured on pypi.org.
    # See docs/project/releasing.md for the one-time setup.
    needs: [build-sdist, build-runtime-wheels]
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/pixshift/
    permissions:
      actions: read # Download artifacts produced by the build jobs.
      attestations: write # Persist provenance and SBOM attestations.
      artifact-metadata: write # Associate attestations with their artifacts.
      contents: read
      id-token: write # Mint short-lived OIDC identities for attestations and PyPI.
    steps:
      - name: Download all build artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: pixshift-*
          path: dist
          merge-multiple: true

      - name: Generate SPDX release SBOM
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0.24.0
        with:
          path: dist
          format: spdx-json
          output-file: release-sbom.spdx.json
          syft-version: v1.51.0
          upload-artifact: false
          upload-release-assets: false

      - name: Generate release checksums
        shell: bash
        run: sha256sum dist/*.whl dist/*.tar.gz > SHA256SUMS

      - name: Attest release build provenance
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: |
            dist/*.whl
            dist/*.tar.gz

      - name: Attest release SBOM
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: |
            dist/*.whl
            dist/*.tar.gz
          sbom-path: release-sbom.spdx.json

      - name: Upload release integrity metadata
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: pixshift-release-metadata
          path: |
            SHA256SUMS
            release-sbom.spdx.json

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2

  github-release:
    name: Publish GitHub Release
    needs: publish
    runs-on: ubuntu-latest
    permissions:
      actions: read # Download the already-attested package artifacts.
      contents: write # Create the release and upload its immutable assets.
    steps:
      - name: Download release artifacts and integrity metadata
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: pixshift-*
          path: dist
          merge-multiple: true

      - name: Create or refresh the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          if gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" dist/* --clobber --repo "$GITHUB_REPOSITORY"
          else
            gh release create "$GITHUB_REF_NAME" dist/* --generate-notes --verify-tag \
              --title "PixShift $GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY"
          fi
