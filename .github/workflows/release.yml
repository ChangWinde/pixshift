name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup uv and Python
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          python-version: "3.12"
          enable-cache: true

      - name: Install build dependencies
        run: uv sync --frozen --extra dev

      - name: Static quality
        run: |
          uv run ruff check .
          uv run ruff format --check .
          uv run mypy . --ignore-missing-imports

      - name: Run tests with coverage gate
        run: uv run pytest -q --cov=pixshift --cov-report=term-missing --cov-fail-under=70

      - name: Build package
        run: uv build

      - name: Check package metadata
        run: uv run twine check dist/*

      - name: Upload build artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: pixshift-dist
          path: dist/*

  publish:
    # Publishes via PyPI trusted publishing (OIDC); requires the `pypi`
    # environment and a matching publisher configured on pypi.org.
    # See docs/RELEASING.md for the one-time setup.
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/pixshift/
    permissions:
      id-token: write
    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          name: pixshift-dist
          path: dist

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
