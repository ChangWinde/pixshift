name: Docs

on:
  push:
    branches: ["main"]
    paths: ["docs/**", "mkdocs.yml", ".github/workflows/docs.yml"]
  workflow_dispatch:

# The site is served from the gh-pages branch (Pages source: legacy/branch),
# so publishing is a plain push by mkdocs gh-deploy. The Actions-based
# deployment path is deliberately not used: creating a Pages site through it
# needs a repository-settings change that GITHUB_TOKEN cannot perform.
permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Setup uv and Python
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          python-version: "3.12"
          enable-cache: true

      - name: Install docs toolchain
        run: uv sync --frozen --extra docs

      - name: Verify the site builds cleanly
        run: uv run mkdocs build --strict

      - name: Publish to gh-pages
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          uv run mkdocs gh-deploy --force
