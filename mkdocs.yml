site_name: PixShift 使用手册
site_description: 本地优先的图片、PDF、视频命令行工具，人和 agent 共用一套接口
site_url: https://changwinde.github.io/pixshift/
repo_url: https://github.com/ChangWinde/pixshift
repo_name: ChangWinde/pixshift
edit_uri: edit/main/docs/
copyright: PixShift · MIT License
strict: true

theme:
  name: material
  language: zh
  font:
    text: JetBrains Mono
    code: JetBrains Mono
  icon:
    repo: fontawesome/brands/github
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: black
      accent: teal
      toggle:
        icon: material/weather-night
        name: 切换到深色模式
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: black
      accent: teal
      toggle:
        icon: material/weather-sunny
        name: 切换到浅色模式
  features:
    - navigation.tabs
    - navigation.tabs.sticky
    - navigation.top
    - navigation.tracking
    - navigation.footer
    - toc.follow
    - content.code.copy
    - content.tabs.link
    - search.suggest
    - search.highlight

extra_css:
  - stylesheets/extra.css

markdown_extensions:
  - abbr
  - admonition
  - attr_list
  - md_in_html
  - tables
  - toc:
      permalink: "#"
      toc_depth: 3
  - pymdownx.details
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true

plugins:
  - search:
      # 中文按标点与空白切分；英文标识符（命令、字段名）保持整体可搜。
      separator: '[\s\u3000\u3001\u3002\uff0c\uff1a\uff1b\uff08\uff09\-_,:!=\[\]()"`/]+'

# 站点只承载使用手册。架构决策记录（adr/）、路线图、发布流程等工程文档
# 保留在仓库中，不进入面向用户的文档站。
exclude_docs: |
  adr/
  project/

nav:
  - 开始:
      - 概览: index.md
      - 安装与环境: install.md
  - 图片: images.md
  - PDF: pdf.md
  - 视频: video.md
  - 自动化:
      - 脚本与 Agent 集成: automation.md
      - JSON 输出契约: JSON_OUTPUT.md
  - 常见问题: faq.md
