[build-system]
requires = ["setuptools>=84.0.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pixshift"
version = "2.0.0"
description = "Fast, safe, automation-first image, PDF, and video CLI toolkit"
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
authors = [
    {name = "PixShift Team"},
]
keywords = ["image", "pdf", "converter", "automation", "batch", "cli"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Intended Audience :: End Users/Desktop",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Multimedia :: Graphics :: Graphics Conversion",
]

dependencies = [
    "Pillow>=9.1",
    "pillow-heif>=0.10.0",
    "click>=8.0",
    "rich>=12.0",
    "PyMuPDF>=1.23.0",
]

[project.optional-dependencies]
avif = ["pillow-avif-plugin"]
all = ["pillow-avif-plugin"]
docs = [
    "mkdocs>=1.6,<2",
    "mkdocs-material>=9.5",
]
dev = [
    "build>=1.2.0",
    "hypothesis>=6.165.2",
    "jsonschema>=4.23",
    "mypy>=1.10",
    "pytest>=7.0",
    "pytest-cov>=4.0",
    # Read mkdocs.yml in the documentation governance tests.
    "pyyaml>=6.0",
    "ruff>=0.16.2",
    "twine>=5.0.0",
]

[project.scripts]
pixshift = "pixshift.cli:main"

[project.urls]
Homepage = "https://github.com/ChangWinde/pixshift"
Repository = "https://github.com/ChangWinde/pixshift"
Issues = "https://github.com/ChangWinde/pixshift/issues"
Documentation = "https://github.com/ChangWinde/pixshift#readme"

[tool.setuptools.packages.find]
include = ["pixshift*"]

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "W", "F", "I", "UP", "B", "SIM", "C4", "PIE", "RUF"]
# Chinese full-width punctuation in CLI copy is intentional.
ignore = ["RUF001", "RUF002", "RUF003"]

[tool.mypy]
python_version = "3.10"
ignore_missing_imports = true
check_untyped_defs = true
disallow_untyped_defs = true
exclude = ["^tests/"]
